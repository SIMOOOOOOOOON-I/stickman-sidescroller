{"name": "Build web version", "on": {"push": {"branches": ["main", "master"]}, "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"name": "Install pygbag", "run": "pip install pygbag"}, {"name": "Build the web version", "run": "python -m pygbag --build ."}, {"name": "Publish to the gh-pages branch", "run": "cd build/web && touch .nojekyll && git init -b gh-pages && git config user.name github-actions && git config user.email github-actions@github.com && git add -A && git commit -m 'Deploy web version' && git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages"}]}}}
